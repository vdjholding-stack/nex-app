<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba del Ojo v2 · Nex</title>
<style>
body{font-family:-apple-system,Arial,sans-serif;background:#14161F;color:#EFE4CC;margin:0;padding:20px;font-size:18px}
h1{font-size:24px;margin:0 0 10px}
input{font-size:22px;padding:10px;border-radius:10px;border:1px solid #8C6D33;width:100%;max-width:420px;box-sizing:border-box;background:#fff;color:#000}
button{font-size:18px;padding:14px 20px;border-radius:12px;border:0;background:#C9A35B;color:#1B1408;font-weight:700;margin:12px 0}
.res{margin-top:8px;padding:10px;border-radius:10px;background:#1E2130;border:1px solid #3A3F55;white-space:pre-wrap;font-size:16px}
.proto{padding:10px;border-radius:10px;margin-bottom:12px;font-weight:700}
img{max-width:100%;margin-top:10px;border:2px solid #8C6D33;border-radius:8px}
a{color:#3FD0D4}
</style>
</head>
<body>
<h1>Prueba del Ojo · v2</h1>
<div class="proto" id="proto"></div>
<p>Escribid la IP de la placa (la del Monitor serie) y pulsad <b>Probar todo</b>.</p>
<input id="ip" inputmode="decimal" autocomplete="off" autocapitalize="off">
<br><button id="go">Probar todo</button>
<div class="res" id="r"></div>
<p id="enlace"></p>
<img id="foto" alt="">
<script>
const p=location.protocol, proto=document.getElementById("proto");
proto.textContent="Esta página se ha abierto con: "+p.replace(":","").toUpperCase()+(p==="https:"?"  ❌ Tiene que ser HTTP. Safari la ha cambiado a https.":"  ✅ correcto");
proto.style.background=p==="https:"?"#5A1E2E":"#1E4A2E";
const inp=document.getElementById("ip");inp.value=localStorage.getItem("nex_ojo_ip")||"";
const out=document.getElementById("r");const log=t=>{out.textContent+=t+"\n";};
function conTiempo(prom,ms){return Promise.race([prom,new Promise((_,ko)=>setTimeout(()=>ko(new Error("tiempo agotado")),ms))]);}
document.getElementById("go").onclick=async()=>{
  const h=inp.value.trim().replace(/^https?:\/\//,"").replace(/\/.*$/,"");localStorage.setItem("nex_ojo_ip",h);out.textContent="";
  const url="http://"+h+"/capture?t="+Date.now();log("Dirección probada: "+url);
  document.getElementById("enlace").innerHTML='Prueba manual: <a href="'+url+'" target="_blank">abrir la foto en otra pestaña</a>';
  // A: ¿llega a la placa? (sin CORS)
  try{await conTiempo(fetch(url,{mode:"no-cors",cache:"no-store"}),8000);log("A · Llegar a la placa: ✅");}catch(e){log("A · Llegar a la placa: ❌ "+(e.message||e));}
  // B: imagen sin CORS
  await new Promise(ok=>{const i=new Image();const t=setTimeout(()=>{log("B · Ver la imagen: ❌ tiempo agotado");ok();},8000);
    i.onload=()=>{clearTimeout(t);log("B · Ver la imagen: ✅ "+i.naturalWidth+"x"+i.naturalHeight);ok();};
    i.onerror=()=>{clearTimeout(t);log("B · Ver la imagen: ❌");ok();};i.src=url+"&b=1";});
  // C: fetch con CORS (lo que usa la app)
  try{const r=await conTiempo(fetch(url+"&c=1",{cache:"no-store"}),8000);const b=await r.blob();document.getElementById("foto").src=URL.createObjectURL(b);
    log("C · Leer la foto desde la app: ✅ "+Math.round(b.size/1024)+" KB");}catch(e){log("C · Leer la foto desde la app: ❌ "+(e.message||e));}
  log("\nNavegador: "+navigator.userAgent);
};
</script>
</body>
</html>
